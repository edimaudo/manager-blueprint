<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Manager Blueprint</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main class="auth-shell"><a class="brand" href="/">Manager Blueprint</a><section class="panel"><h1>Create your account</h1><p>Your account starts with free access. Paid features remain locked until an entitlement is assigned.</p><form method="post" action="/signup"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><input type="hidden" name="tier_choice" value="free"><button class="button" type="submit">Create account</button></form><p>Already have an account? <a href="/login">Sign in</a></p></section></main></body></html>
