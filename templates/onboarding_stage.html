<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Management stage | Manager Blueprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/app.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/">Manager Blueprint</a><div class="controls">
  <button type="button" data-theme-toggle aria-pressed="false">Dark mode</button>
  <div class="sizes" role="group" aria-label="Text size"><button type="button" data-size="small" aria-label="Small text">A−</button><button type="button" data-size="medium" aria-label="Medium text" aria-pressed="true">A</button><button type="button" data-size="large" aria-label="Large text">A+</button></div>
</div></header>
<main class="auth-shell">
  <div class="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1"><span style="width:33.333%"></span></div>
  <h1>Where are you in your management journey?</h1>
  <p class="muted">Your management stage helps tailor the development areas and situations in your Blueprint.</p>
  <form class="panel" method="post" action="/onboarding/stage">
    <fieldset class="question">
      <legend>Select the stage that best describes you now.</legend>
      {% for key,label in stages.items() %}
      <label class="choice"><input type="radio" name="management_stage" value="{{ key }}" required {% if selected==key %}checked{% endif %}><span><strong>{{ label }}</strong>{% if key=='first_time' %}<br><span class="muted">You have recently moved from individual contributor to manager.</span>{% elif key=='aspiring' %}<br><span class="muted">You are preparing for your first management role.</span>{% endif %}</span></label>
      {% endfor %}
    </fieldset>
    <button class="button" type="submit">Continue</button>
  </form>
</main>
</body>
</html>
