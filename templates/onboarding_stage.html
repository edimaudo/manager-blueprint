<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management stage | Manager Blueprint</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="/">Manager Blueprint</a><div class="controls"><button data-theme-toggle>Dark mode</button><div class="sizes"><button data-size="small">Small</button><button data-size="medium" aria-pressed="true">Medium</button><button data-size="large">Large</button></div></div></header><main class="auth-shell"><p class="eyebrow">STEP 1 OF 3</p><h1>Where are you in your management journey?</h1><p>Your stage helps tailor the situations, guidance, and recommendations in your Blueprint.</p><form class="panel" method="post" action="/onboarding/stage">{% for key,label in stages.items() %}<label class="choice"><input type="radio" name="management_stage" value="{{ key }}" required {% if selected==key %}checked{% endif %}> <span><strong>{{ label }}</strong>{% if key=='first_time' %}<br><span class="muted">A practical starting path for new managers.</span>{% endif %}</span></label>{% endfor %}<button class="button" type="submit">Continue to goals</button></form></main></body></html>
