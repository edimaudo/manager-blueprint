<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator sign in | Manager Blueprint</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main class="auth-shell"><a class="brand" href="/">Manager Blueprint</a><section class="panel"><h1>Administrator sign in</h1><p>This route is restricted to accounts with an administrator role assigned server-side.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/admin/login"><label for="email">Administrator email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in to administration</button></form></section></main></body></html>
