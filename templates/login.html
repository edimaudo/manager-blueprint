<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Manager Blueprint</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main class="auth-shell"><a class="brand" href="/">Manager Blueprint</a><section class="panel"><h1>Sign in</h1><p>Continue building your management skills.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}{% if expired %}<p class="error" role="alert">Your session expired. Sign in again.</p>{% endif %}<form method="post" action="/login"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in</button></form><p>New to Manager Blueprint? <a href="/signup">Create an account</a></p></section></main></body></html>
